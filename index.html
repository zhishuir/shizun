<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026马年大吉</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        /* 动态星空背景 */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        .star {
            position: absolute;
            background: radial-gradient(circle, #FFD700 0%, transparent 70%);
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
        
        /* 马匹容器 */
        .horse-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .horse-container:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }
        
        .horse-container.clicked {
            animation: horseOut 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        
        @keyframes horseOut {
            0% { 
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.5) rotate(180deg);
                opacity: 0.7;
            }
            100% { 
                transform: translate(-50%, -50%) scale(0) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* 精美emoji马匹 */
        .horse-emoji {
            font-size: clamp(150px, 35vw, 400px);
            display: block;
            filter: 
                drop-shadow(0 0 40px rgba(255, 215, 0, 0.8))
                drop-shadow(0 0 80px rgba(255, 165, 0, 0.6))
                drop-shadow(0 0 120px rgba(255, 215, 0, 0.4));
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { 
                transform: translateY(0px) rotate(-3deg);
                filter: 
                    drop-shadow(0 0 40px rgba(255, 215, 0, 0.8))
                    drop-shadow(0 0 80px rgba(255, 165, 0, 0.6));
            }
            50% { 
                transform: translateY(-30px) rotate(3deg);
                filter: 
                    drop-shadow(0 0 60px rgba(255, 215, 0, 1))
                    drop-shadow(0 0 100px rgba(255, 165, 0, 0.8))
                    drop-shadow(0 0 140px rgba(255, 215, 0, 0.6));
            }
        }
        
        /* 光环效果 */
        .horse-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(255,215,0,0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            z-index: -1;
        }
        
        @keyframes pulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.8;
            }
        }
        
        /* 提示文字 */
        .hint {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            color: #FFD700;
            font-size: clamp(26px, 5vw, 46px);
            font-weight: 900;
            text-shadow: 
                0 0 20px rgba(255, 215, 0, 1),
                0 0 40px rgba(255, 215, 0, 0.8),
                0 0 60px rgba(255, 165, 0, 0.6);
            animation: hintPulse 2s ease-in-out infinite;
            pointer-events: none;
            z-index: 10;
            letter-spacing: 0.15em;
        }
        
        @keyframes hintPulse {
            0%, 100% { 
                opacity: 0.8; 
                transform: translateX(-50%) translateY(0px);
            }
            50% { 
                opacity: 1; 
                transform: translateX(-50%) translateY(-10px);
            }
        }
        
        /* 中心大字 */
        .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(50px, 11vw, 110px);
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 25%, #FFD700 50%, #FF8C00 75%, #FFD700 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8))
                    drop-shadow(0 0 60px rgba(255, 165, 0, 0.6));
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            white-space: nowrap;
            letter-spacing: 0.08em;
        }
        
        .center-text.show {
            animation: textShow 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                       gradientFlow 4s linear infinite;
        }
        
        @keyframes textShow {
            0% { 
                opacity: 0; 
                transform: translate(-50%, -50%) scale(0.2) rotateX(90deg);
            }
            100% { 
                opacity: 1; 
                transform: translate(-50%, -50%) scale(1) rotateX(0deg);
            }
        }
        
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* 祝福词 - 白色多种特效 */
        .blessing {
            position: absolute;
            font-size: clamp(30px, 6.5vw, 55px);
            font-weight: 900;
            color: #FFFFFF;
            text-shadow: 
                0 0 15px rgba(255, 255, 255, 0.8),
                0 0 30px rgba(255, 255, 255, 0.5),
                0 4px 8px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 8;
            opacity: 0;
        }
        
        /* 泡泡上浮效果 */
        .blessing.bubble {
            animation: bubbleFloat 5s ease-out forwards;
        }
        
        @keyframes bubbleFloat {
            0% { 
                opacity: 0; 
                transform: translateY(100px) scale(0.3);
            }
            20% { 
                opacity: 1; 
                transform: translateY(0) scale(1);
            }
            80% {
                opacity: 1;
                transform: translateY(-250px) scale(1);
            }
            100% { 
                opacity: 0; 
                transform: translateY(-350px) scale(0.7);
            }
        }
        
        /* 旋转飘落效果 */
        .blessing.rotate-fall {
            animation: rotateFall 4s ease-out forwards;
        }
        
        @keyframes rotateFall {
            0% { 
                opacity: 0; 
                transform: translateY(-100px) rotate(0deg) scale(0.3);
            }
            20% { 
                opacity: 1; 
                transform: translateY(0) rotate(180deg) scale(1.1);
            }
            80% {
                opacity: 1;
                transform: translateY(200px) rotate(540deg) scale(1);
            }
            100% { 
                opacity: 0; 
                transform: translateY(300px) rotate(720deg) scale(0.5);
            }
        }
        
        /* 缩放弹出效果 */
        .blessing.zoom-pop {
            animation: zoomPop 3s ease-out forwards;
        }
        
        @keyframes zoomPop {
            0% { 
                opacity: 0; 
                transform: scale(0) rotate(-180deg);
            }
            15% { 
                opacity: 1; 
                transform: scale(1.3) rotate(0deg);
            }
            30% {
                transform: scale(0.9) rotate(10deg);
            }
            45% {
                transform: scale(1.05) rotate(-5deg);
            }
            60% {
                transform: scale(1) rotate(0deg);
            }
            85% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            100% { 
                opacity: 0; 
                transform: scale(0.3) rotate(180deg);
            }
        }
        
        /* 左右摇摆效果 */
        .blessing.swing {
            animation: swingMove 4s ease-in-out forwards;
        }
        
        @keyframes swingMove {
            0% { 
                opacity: 0; 
                transform: translateX(-200px) rotate(-20deg);
            }
            20% { 
                opacity: 1; 
                transform: translateX(0) rotate(0deg);
            }
            30% {
                transform: translateX(30px) rotate(10deg);
            }
            50% {
                transform: translateX(-20px) rotate(-10deg);
            }
            70% {
                transform: translateX(15px) rotate(5deg);
            }
            85% {
                opacity: 1;
                transform: translateX(0) rotate(0deg);
            }
            100% { 
                opacity: 0; 
                transform: translateX(200px) rotate(20deg);
            }
        }
        
        /* 螺旋上升效果 */
        .blessing.spiral {
            animation: spiralUp 5s ease-out forwards;
        }
        
        @keyframes spiralUp {
            0% { 
                opacity: 0; 
                transform: translate(0, 150px) rotate(0deg) scale(0.5);
            }
            20% { 
                opacity: 1; 
            }
            100% { 
                opacity: 0; 
                transform: translate(var(--spiral-x), -400px) rotate(1080deg) scale(0.3);
            }
        }
        
        /* 烟花粒子 */
        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
            animation: fireworkBurst 1s ease-out forwards;
        }
        
        @keyframes fireworkBurst {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- 星空 -->
    <div id="stars"></div>
    
    <!-- 马匹 -->
    <div class="horse-container" id="horseContainer">
        <div class="horse-emoji">🐴</div>
    </div>
    
    <div class="hint" id="hint">✨ 丙午年祝我师尊 ✨</div>
    <div class="center-text" id="text">丙午年祝我师尊</div>
    
    <!-- 背景音乐 AAC格式 -->
    <audio id="bgMusic" loop>
        <source src="1.aac" type="audio/aac">
        <source src="1.m4a" type="audio/mp4">
    </audio>

    <script>
        let clicked = false;
        const horseContainer = document.getElementById('horseContainer');
        const hint = document.getElementById('hint');
        const text = document.getElementById('text');
        const bgMusic = document.getElementById('bgMusic');
        
        const blessings = [
            '突破', '暴富', '健康', '平安', '快乐', '成功', '幸福', '如意', '吉祥', '圆满',
            '发财', '好运', '顺利', '兴旺', '腾飞', '辉煌', '美满', '旺财', '进步', '欢喜',
            '安康', '福气', '兴隆', '富贵', '长寿', '喜庆', '繁荣', '昌盛', '和睦', '温馨',
            '甜蜜', '称心', '得意', '风顺', '心想事成', '万事如意', '财源广进', '步步高升',
            '事业有成', '马年大吉', '身体健康', '笑口常开', '龙马精神', '一帆风顺', '大展宏图',
            '锦绣前程', '鹏程万里', '马到成功', '春风得意', '喜气洋洋'
        ];
        
        // 特效类型数组
        const effectTypes = ['bubble', 'rotate-fall', 'zoom-pop', 'swing', 'spiral'];
        
        // 创建星空
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }
        
        // 创建烟花效果
        function createFirework(x, y) {
            const particleCount = 30;
            const fireworkColors = ['#FFD700', '#FFA500', '#FF8C00', '#FFB700', '#FFC700'];
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.backgroundColor = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
                
                const angle = (Math.PI * 2 * i) / particleCount;
                const velocity = 100 + Math.random() * 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 1000);
            }
        }
        
        // 显示祝福词 - 白色多种特效
        function showBlessing() {
            const b = document.createElement('div');
            b.className = 'blessing';
            b.textContent = blessings[Math.floor(Math.random() * blessings.length)];
            
            // 随机选择一种特效
            const effectType = effectTypes[Math.floor(Math.random() * effectTypes.length)];
            b.classList.add(effectType);
            
            let x, y;
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            
            // 根据特效类型确定起始位置
            switch(effectType) {
                case 'bubble': // 泡泡从底部上浮，避开中心
                    const isLeft = Math.random() > 0.5;
                    if (isLeft) {
                        x = Math.random() * (window.innerWidth * 0.35) + 50;
                    } else {
                        x = Math.random() * (window.innerWidth * 0.35) + window.innerWidth * 0.65;
                    }
                    y = window.innerHeight + 50;
                    break;
                    
                case 'rotate-fall': // 旋转从上方飘落，避开中心
                    if (Math.random() > 0.5) {
                        x = Math.random() * (window.innerWidth * 0.4);
                    } else {
                        x = Math.random() * (window.innerWidth * 0.4) + window.innerWidth * 0.6;
                    }
                    y = -50;
                    break;
                    
                case 'zoom-pop': // 缩放弹出，周围区域
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.min(window.innerWidth, window.innerHeight) * 0.35 + Math.random() * 150;
                    x = cx + Math.cos(angle) * distance;
                    y = cy + Math.sin(angle) * distance;
                    break;
                    
                case 'swing': // 左右摇摆
                    y = Math.random() * window.innerHeight * 0.6 + window.innerHeight * 0.2;
                    x = Math.random() > 0.5 ? -200 : window.innerWidth + 200;
                    break;
                    
                case 'spiral': // 螺旋上升
                    x = Math.random() * window.innerWidth * 0.8 + window.innerWidth * 0.1;
                    y = window.innerHeight + 50;
                    const spiralX = (Math.random() - 0.5) * 200;
                    b.style.setProperty('--spiral-x', spiralX + 'px');
                    break;
            }
            
            b.style.left = x + 'px';
            b.style.top = y + 'px';
            document.body.appendChild(b);
            
            // 5秒后自动移除
            setTimeout(() => b.remove(), 5000);
        }
        
        // 开始祝福
        function startBlessings() {
            let count = 0, speed = 500;
            function schedule() {
                if (!clicked) return;
                showBlessing();
                count++;
                speed = Math.max(200, 500 - count * 10);
                setTimeout(schedule, speed);
            }
            schedule();
        }
        
        // 点击事件
        horseContainer.addEventListener('click', function() {
            if (clicked) return;
            clicked = true;
            
            // 播放背景音乐
            bgMusic.play().catch(e => console.log('音乐播放失败:', e));
            
            hint.classList.add('hidden');
            horseContainer.classList.add('clicked');
            
            // 点击位置烟花
            const rect = horseContainer.getBoundingClientRect();
            createFirework(rect.left + rect.width / 2, rect.top + rect.height / 2);
            
            setTimeout(() => {
                horseContainer.classList.add('hidden');
                text.classList.add('show');
                startBlessings();
            }, 1200);
        });
        
        // 初始化
        createStars();
    </script>
</body>
</html>
